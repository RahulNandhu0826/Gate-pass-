{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Teacher Sign Up</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
        background: url("static/advisor.jpeg");   
        background-size:cover;
        background-size: 100rem;
        padding:5% ;
        }
        .signup-card {
            max-width: 450px;
            margin: auto;
            margin-top: 60px;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card signup-card">
        <h3 class="text-center mb-4">Teacher Sign Up</h3>

        {% if key %}
            <div class="alert alert-danger text-center">{{ key }}</div>
        {% endif %}

        <form action="" method="post">
            {%csrf_token%}
<div class="row">
    <div class="col-6">
            <div class="mb-3">
                <label class="form-label">Teacher Name</label>
                <input type="text" name="teacher_name" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Teacher ID</label>
                <input type="text" name="teacher_id" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Teacher Email</label>
                <input type="email" name="teacher_email" class="form-control" required>
            </div>

    </div>
    <div class="col-6">
            <div class="mb-3">
                <label class="form-label">Phone Number</label>
                <input type="tel" name="teacher_phone" class="form-control" required>
            </div>

             <div class="mb-3">
                <label class="form-label">Department</label>
                <input type="text" name="teacher_dept" class="form-control" required>
            </div>
            

            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="pass" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Confirm Password</label>
                <input type="password" name="c_pass" class="form-control" required>
            </div>
            </div>

            <button type="submit" class="btn btn-primary w-100">Create Account</button>
</div>
        </form>
    </div>
</div>

</body>
</html>

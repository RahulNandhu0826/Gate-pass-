{%load static%}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HOD Sign Up</title>

<!-- Bootstrap 5 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
height:100vh;
display:flex;
align-items:center;
justify-content:center;
 background: url("{% static 'hod.jpg' %}") no-repeat center center fixed;
  background-size: cover;
animation: gradientBG 10s ease infinite;
}

@keyframes gradientBG{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.signup-card{
width:420px;
border-radius:15px;
animation: fadeIn 1s ease-in-out;
}

@keyframes fadeIn{
from{
opacity:0;
transform:translateY(30px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.btn-primary:hover{
transform:scale(1.05);
transition:0.3s;
}

</style>

</head>

<body>

<div class="card shadow signup-card">

<div class="card-body p-4">

<h3 class="text-center text-primary mb-3">HOD Sign Up</h3>

<p class="text-center text-danger">{{key}}</p>

<form method="post">
{% csrf_token %}

<div class="mb-3">
<label class="form-label">Teacher Name</label>
<input type="text" name="hod_name" class="form-control" placeholder="Enter Name" required>
</div>

<div class="mb-3">
<label class="form-label">Teacher ID</label>
<input type="text" name="hod_id" class="form-control" placeholder="Enter ID" required>
</div>

<div class="mb-3">
<label class="form-label">Email</label>
<input type="email" name="hod_email" class="form-control" placeholder="Enter Email" required>
</div>

<div class="mb-3">
<label class="form-label">Phone Number</label>
<input type="tel" name="hod_phone" class="form-control" placeholder="Enter Phone Number" required>
</div>

<div class="mb-3">
<label class="form-label">Password</label>
<input type="password" name="pass" class="form-control" placeholder="Enter Password" required>
</div>

<div class="mb-3">
<label class="form-label">Confirm Password</label>
<input type="password" name="c_pass" class="form-control" placeholder="Confirm Password" required>
</div>

<div class="d-grid">
<button type="submit" class="btn btn-primary">Sign Up</button>
</div>

</form>

<div class="text-center mt-3">
<small>Already have an account?</small><br>
<a href="Hod_log" class="text-decoration-none">Login Here</a>
</div>

</div>

</div>

</body>
</html>

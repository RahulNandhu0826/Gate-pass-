{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advisor Profile</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

    <!-- Font Awesome -->
    <script src="https://kit.fontawesome.com/2ccda84a46.js" crossorigin="anonymous"></script>

    <style>
        body{
             background: url("static/advisor.jpeg");   
             background-size:cover;
           
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .profile-card{
            background: #fff;
            border-radius: 20px;
            padding: 30px;
            width: 350px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            text-align: center;
            position: relative;
        }

        .avatar{
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: #007bff;
            color: #fff;
            font-size: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: auto;
            margin-bottom: 15px;
        }

        .info{
            text-align: left;
            margin-top: 20px;
        }

        .info p{
            margin: 8px 0;
            font-size: 16px;
        }

        .info i{
            color: #007bff;
            width: 25px;
        }

        .back-btn{
            position: absolute;
            top: 15px;
            left: 15px;
        }
    </style>
</head>
<body>

<div class="profile-card">

    <!-- Back Button -->
    <a href="javascript:history.back()" class="btn btn-outline-secondary btn-sm back-btn">
        <i class="fas fa-arrow-left"></i>
    </a>

    <div class="avatar">
        <i class="fas fa-user-tie"></i>
    </div>

    <h4>{{ key.TEACHER_NAME }}</h4>
    <small class="text-muted">Advisor</small>

    <div class="info mt-3">
        <p><i class="fas fa-phone"></i> {{ key.TEACHER_PHONE }}</p>
        <p><i class="fas fa-envelope"></i> {{ key.Advisor.email }}</p>
    </div>

</div>

</body>
</html>

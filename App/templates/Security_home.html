{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Security Home</title>

<!-- Bootstrap 5 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Bootstrap Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>

body{
height:100vh;
background:url("{% static 'security.jpeg' %}") no-repeat center/cover;
font:white;
font-family:Segoe UI;
}

.dashboard-card{
transition:0.3s;
}

.dashboard-card:hover{
transform:scale(1.05);
}

.text-shadow{
    text-shadow: 2px 2px 6px rgba(0,0,0,0.8);
}

</style>

</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-dark bg-dark shadow">
<div class="container">

<span class="navbar-brand">
<i class="bi bi-shield-lock"></i> Security Portal
</span>

<a href="Securitylogout" class="btn btn-danger">
<i class="bi bi-box-arrow-right"></i> Logout
</a>

</div>
</nav>


<!-- Main Container -->
<div class="container mt-5">

<div class="text-center mb-5">
<h2 class="fw-bold text-white text-shadow">
    Welcome {{key.SECURITY_NAME}} Officer
</h2>
<p class="text-white">Gate Pass Verification System</p>
</div>

<div class="row justify-content-center">

<!-- Gate Pass Card -->
<div class="col-md-4">

<div class="card shadow border-0 text-center dashboard-card">

<div class="card-body">

<i class="bi bi-qr-code-scan text-primary" style="font-size:50px;"></i>

<h4 class="mt-3">Gate Pass Scan</h4>

<p class="text-muted">
Scan student QR code to verify gate pass.
</p>

<a href="Security_Barcode" class="btn btn-primary">
Open Scanner
</a>

</div>

</div>

</div>

<div class="col-md-4">

<div class="card shadow border-0 text-center dashboard-card">

<div class="card-body">

<i class="bi bi-qr-code-scan text-primary" style="font-size:50px;"></i>

<h4 class="mt-3">Re Entry Scan</h4>

<p class="text-muted">
Scan student QR code to Re Entry.
</p>

<a href="Security_re_entry_scan" class="btn btn-primary">
Open Scanner
</a>

</div>

</div>

</div>

</div>

</div>

</body>
</html>

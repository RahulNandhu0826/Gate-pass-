{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Re Entry Scanning</title>

    <!-- Bootstrap 5 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />

    <style>
      body {
        background: url("{% static 'security.jpeg' %}") no-repeat center/cover;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .card {
        border-radius: 15px;
      }

      .table td {
        vertical-align: middle;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <!-- Card -->
      <div class="card shadow-lg">
        <div class="card-header bg-dark text-white text-center">
          <h4>
            <i class="bi bi-shield-check"></i> Security Re Entry Scanning
          </h4>
        </div>

        <div class="card-body">
         

            <div class="table-responsive">
              <table class="table table-bordered table-striped text-center">
                <thead class="table-dark">
                  <tr>
                    <th>Student Name</th>
                    <th>Branch</th>
                    <th>Year</th>
                    
                    <th>Date</th>
                    <th>Time</th>   
                    
                  </tr>
                </thead>

                <tbody>
                  <tr>
                    <td>
                     {{keys.STUD_NAME}}
                    </td>

                    <td>
                    {{keys.STUD_BRANCH}}
                    </td>

                    <td>
                     {{keys.STUD_YEAR}}
                    </td>
                    <td>{{keys.gate_date}}</td>
                    <td>
                      {{keys.exit_time}}
                    </td>

                  </tr>
                </tbody>
              </table>
            </div>
            <div class="text-center mt-3">
            
            <a href="{% url 're_entrys' keys.id%}" class="btn btn-outline-success btn-primary text-light">Re Entry</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>

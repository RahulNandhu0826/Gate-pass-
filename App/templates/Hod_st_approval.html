{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>HOD Gate Pass Approval</title>

    <!-- Bootstrap -->
    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
    />

    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        background: url("{% static 'hod.jpg' %}") no-repeat center center fixed;
        background-size: cover;
        margin: 0;
      }

      /* Overlay */
      .overlay {
        background: rgba(0, 0, 0, 0.6);
        min-height: 100vh;
        padding-top: 80px;
      }

      /* Navbar */
      .navbar {
        background: rgba(0, 0, 0, 0.85);
      }

      /* Container */
      .container-box {
        width: 80%;
        margin: auto;
      }

      /* Header */
      .header {
        background: #2c3e50;
        color: white;
        padding: 15px;
        text-align: center;
        border-radius: 10px 10px 0 0;
      }

      /* Table box */
      .table-box {
        background: white;
        padding: 20px;
        border-radius: 0 0 10px 10px;
        box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.3);
      }

      /* Table */
      table {
        width: 100%;
        border-collapse: collapse;
      }

      th {
        background: #34495e;
        text-align: center;
        color: white;
        padding: 12px;
      }

      td {
        padding: 10px;
        text-align: center;
        border-bottom: 1px solid #ddd;
      }

      tr:hover {
        background: #f2f2f2;
      }

      /* Notification */
      .notification {
        background: #ffe9a8;
        color: red;
        padding: 15px;
        text-align: center;
        border-radius: 6px;
        font-weight: bold;
      }
    </style>
  </head>

  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-dark fixed-top">
      <div class="container d-flex justify-content-between">
        <span class="navbar-brand">HOD Panel</span>

        <div>
          <!-- Back Button -->
          <a href="Hod_Home" class="btn btn-light btn-sm mr-2"> ⬅ Back </a>
        </div>
      </div>
    </nav>

    <div class="overlay">
      <div class="container-box">
        <div class="header">
          <h2>Student Gate Pass Requests</h2>
        </div>

        <div class="table-box">
          <table>
            <tr>
              <th>Student Name</th>
              <th>Branch</th>
              <th>Year</th>
              <th>Reason</th>
              <th colspan="2">Options</th>
            </tr>
            {% for i in key %}
            <tr>
              <td>{{ i.STUD_NAME }}</td>
              <td>{{ i.STUD_BRANCH }}</td>
              <td>{{ i.STUD_YEAR }}</td>
              <td>{{i.REASONS}}</td>
              <td>
                <a
                  href="{% url 'pay_acceptss' i.id %}"
                  class="btn btn-success btn-sm"
                >
                  Accept
                </a>
              </td>

              <td>
                <a
                  href="{% url 'pay_Rejectss' i.id %}"
                  class="btn btn-danger btn-sm"
                >
                  Reject
                </a>
              </td>
            </tr>
            {% empty %}
            <tr>
              <td colspan="6">
                <div class="notification">No permission requests available</div>
              </td>
            </tr>
            {% endfor %}
          </table>
        </div>
      </div>
    </div>
  </body>
</html>

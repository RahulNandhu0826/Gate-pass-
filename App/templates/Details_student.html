{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Gate Pass</title>

<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
<script src="https://kit.fontawesome.com/2ccda84a46.js" crossorigin="anonymous"></script>

<style>
body{
    background: url("static/advisor.jpeg");   
    background-size:cover;
    min-height: 100vh;
    padding: 30px;
    color: #333;
}

.card{
    border-radius: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.4);
}

.profile-icon{
    font-size: 70px;
    color: #007bff;
}

.clock-box{
    background: #000;
    color: #0f0;
    padding: 15px;
    border-radius: 10px;
    text-align: center;
    margin-top: 15px;
}

textarea{
    resize: none;
}
</style>
</head>
<body>

<div class="container">
<div class="row justify-content-center">

<div class="col-md-10">

<div class="card p-4">

<div class="row">

<!-- Student Info -->
<div class="col-md-4 text-center border-right">

<i class="fas fa-user-graduate profile-icon"></i>
<h4 class="mt-2">{{ key.NAME }}</h4>
<p class="text-muted">{{ key.BRANCH }} - Year {{ key.YEAR }}</p>
<p>Parents Phone Numbers</p>
<p><i class="fas fa-phone"></i> {{ key.PHONE1 }}</p>
<p><i class="fas fa-phone"></i> {{ key.PHONE2 }}</p>

<div class="clock-box">
<div id="clock" style="font-size:28px;"></div>
<div id="date"></div>
</div>

</div>

<!-- Gate Pass Form -->
<div class="col-md-8">

<h4 class="mb-3"><i class="fas fa-id-card"></i> Gate Pass Request</h4>

<form method="post">
{% csrf_token %}

<div class="form-row">
<div class="form-group col-md-6">
<label>Name</label>
<input type="text" class="form-control" name="Name" value="{{ key.NAME }}" readonly>
</div>

<div class="form-group col-md-6">
<label>Branch</label>
<input type="text" class="form-control" name="Branch" value="{{ key.BRANCH }}" readonly>
</div>
</div>

<div class="form-row">
<div class="form-group col-md-6">
    <label>Admission Number</label>
<input type="phone" class="form-control"  value="{{ key.ADMISSION_NO }}" readonly>

</div>

<div class="form-group col-md-6">
<label>Year</label>
<input type="text" class="form-control" name="Year" value="{{ key.YEAR }}" readonly>
</div>
</div>

<div class="form-group">
<label>Reason for Gate Pass</label>
<textarea class="form-control" rows="4" name="Reason" required placeholder="Enter reason here..."></textarea>
</div>

<!-- Hidden Fields -->
<input type="hidden" value="{{ key.ADMISSION_NO }}">
<input type="hidden" value="{{ key.id }}" name="Admission">
<input type="hidden" value="{{ keys.TEACHER_NAME }}" name="Teacher_name">
<input type="hidden" value="NO" name="approved">
<input type="hidden" value="{{ key.PHONE1  }}" name="Phone_no1">



<div class="text-right mt-3">
<button type="submit" class="btn btn-success">
<i class="fas fa-paper-plane"></i> Submit Request
</button>

<a href="javascript:history.back()" class="btn btn-outline-secondary ml-2">
<i class="fas fa-arrow-left"></i> Back
</a>
</div>

</form>

</div>

</div>
</div>

</div>
</div>

</div>

<script>
function updateClock() {
    const now = new Date();

    let h = String(now.getHours()).padStart(2,'0');
    let m = String(now.getMinutes()).padStart(2,'0');
    let s = String(now.getSeconds()).padStart(2,'0');

    document.getElementById("clock").innerHTML = h+":"+m+":"+s;

    const options = { day: '2-digit', month: 'long', year: 'numeric' };
    document.getElementById("date").innerHTML = now.toLocaleDateString('en-IN', options);
}

setInterval(updateClock,1000);
updateClock();
</script>

</body>
</html>

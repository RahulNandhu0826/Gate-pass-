{% load static %}
<!DOCTYPE html>
<html>
<head>
<title> Without ID </title>

<!-- Bootstrap -->
<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

<!-- Font Awesome -->
<script src="https://kit.fontawesome.com/2ccda84a46.js" crossorigin="anonymous"></script>

<!-- Barcode Scanner -->
<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{
    background: url("{% static 'advisor.jpeg' %}") no-repeat center/cover;
    min-height: 100vh;
}

/* Overlay */
.overlay{
    background: rgba(0,0,0,0.6);
    min-height:100vh;
    padding-top:80px;
}

/* Navbar */
.navbar{
    background: rgba(0,0,0,0.85);
}

/* Scanner card */
.scanner-card{
    background: white;
    border-radius: 18px;
    padding: 25px;
    width: 420px;
    box-shadow: 0 12px 35px rgba(0,0,0,0.3);
    text-align: center;
    margin:auto;
}

/* Reader */
#reader{
    width: 100%;
    border-radius: 15px;
    overflow: hidden;
}
</style>
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-dark fixed-top">
<div class="container d-flex justify-content-between">

<span class="navbar-brand">
<i class="fas fa-qrcode"></i> Without Id
</span>

<div>
<!-- Back Button -->
<a href="Advisor_home" class="btn btn-light btn-sm mr-2">
⬅ Back
</a>


</div>

</div>
</nav>

<div class="overlay">

<div class="scanner-card">

<span class="fa-stack fa-3x">
  <i class="fas fa-qrcode fa-stack-1x text-primary"></i>
  <i class="fas fa-times fa-stack-2x text-danger"></i>
</span>

{% if key %}
<div class="alert alert-success text-center">{{ key }}</div>
{% endif %}

<h4> without Barcode Scanner</h4>
<form method="post" class="mt-3">
{% csrf_token %}
<div id="reader"></div>

<input type="text"  name="barcode"
       class="form-control mt-3"
       placeholder="Enter Admission number">

<input type="text" value="{{ keys.TEACHER_DEPT }}" hidden name="ad">

<button type="submit" 
        class="btn btn-success mt-3 w-100" >
Submit
</button>

</form>

</div>

</div>


</body>
</html>

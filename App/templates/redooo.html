
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>REDO</title>
 <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
  </head>

<style>

body{
    font-family: Arial, Helvetica, sans-serif;
    background:#f4f6f9;
    margin:0;
    padding:0;
}

.container{
    width:80%;
    margin:auto;
    margin-top:40px;
}

.header{
    background:#2c3e50;
    color:white;
    padding:15px;
    text-align:center;
    border-radius:6px 6px 0 0;
}

.table-box{
    background:white;
    padding:20px;
    border-radius:0 0 6px 6px;
    box-shadow:0px 2px 8px rgba(0,0,0,0.1);
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#34495e;
    color:white;
    padding:10px;
}

td{
    padding:10px;
    text-align:center;
    border-bottom:1px solid #ddd;
}

tr:hover{
    background:#f2f2f2;
}

.notification{
    background:#ffe9a8;
    color:red;
    padding:15px;
    text-align:center;
    border-radius:6px;
    font-weight:bold;
}
#reader{
    width:100%;
    border-radius:10px;
    overflow:hidden;
    }

.back-btn{
    position:absolute;
    top:20px;
    left:20px;
    }

</style>

</head>

<body>
    <!-- Back Button -->
<button  class="btn btn-light shadow back-btn">
<i class="fas fa-arrow-left"><a href="Advisor_home">Back</a></i> 
</button>
<div class="container">



<div class="table-box">

<table>
<tr>
<th>Student Name</th>
<th>Branch</th>
<th>Year</th>
<th colspan="1">Options</th>

</tr>

{% for i in key %}
<tr>
<td>{{ i.STUD_NAME }}</td>
<td>{{ i.STUD_BRANCH }}</td>
<td>{{ i.STUD_YEAR }}</td>
<td><a href="{% url 'rdRejectss' i.id%}" class="btn btn-outline-danger btn-dark text-light">Reject</a></td>
</tr>

{% empty %}

<tr>
<td colspan="4">
<div class="notification">
THERE IS NO REDO
</div>
</td>
</tr>

{% endfor %}

</table>

</div>

</div>

</body>
</html>

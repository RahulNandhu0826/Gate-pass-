{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HOD Login</title>

<!-- Bootstrap 5 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
 background: url("{% static 'hod.jpg' %}") no-repeat center center fixed;
  background-size: cover;
height:100vh;
display:flex;
align-items:center;
justify-content:center;
}

.login-card{
width:400px;
border-radius:15px;
}

</style>

</head>

<body>

<div class="card shadow login-card">

<div class="card-body p-4">

<h3 class="text-center mb-4 text-primary">HOD Login</h3>

<!-- Message -->
<p class="text-center text-danger">{{key}}</p>

<form method="post">
{% csrf_token %}

<div class="mb-3">
<label class="form-label">HOD ID</label>
<input type="text" name="hod_id" class="form-control" placeholder="Enter HOD ID" required>
</div>

<div class="mb-3">
<label class="form-label">Password</label>
<input type="password" name="pass" class="form-control" placeholder="Enter Password" required>
</div>

<div class="d-grid">
<button type="submit" class="btn btn-primary">Login</button>
</div>

</form>

<div class="text-center mt-3">
<small>Don't have an account?</small><br>
<a href="Hod_sign" class="text-decoration-none">Register Here</a>
</div>

</div>

</div>

</body>
</html>

{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Login</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body{
            height: 100vh;
            background: linear-gradient(
                rgba(0,0,0,0.6),
                rgba(0,0,0,0.6)
            ),
            url("{% static 'security.jpeg' %}") no-repeat center/cover;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .glass-box{
            width: 360px;
            padding: 35px;
            background: rgba(255,255,255,0.15);
            border-radius: 16px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            color: white;
        }

        .glass-box h2{
            text-align: center;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }

        .input-group{
            margin-bottom: 18px;
        }

        .input-group label{
            font-size: 13px;
            opacity: 0.9;
        }

        .input-group input{
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border-radius: 8px;
            border: none;
            outline: none;
            background: rgba(255,255,255,0.25);
            color: white;
            font-size: 14px;
        }

        .input-group input::placeholder{
            color: rgba(255,255,255,0.7);
        }

        .input-group input:focus{
            background: rgba(255,255,255,0.35);
            box-shadow: 0 0 0 2px rgba(0,123,255,0.5);
        }

        .login-btn{
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: none;
            border-radius: 30px;
            background: linear-gradient(135deg,#00c6ff,#0072ff);
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s ease;
        }

        .login-btn:hover{
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0,114,255,0.6);
        }

        .extra{
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }

        .extra a{
            color: #00c6ff;
            text-decoration: none;
            font-weight: 600;
        }

        .extra a:hover{
            text-decoration: underline;
        }

        .error{
            text-align: center;
            background: rgba(255,0,0,0.3);
            padding: 8px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 13px;
        }

        @media(max-width:400px){
            .glass-box{
                width: 90%;
            }
        }
    </style>
</head>

<body>

    <div class="glass-box">
        <h2><a href="\">🔐</a> Security Login</h2>

        {% if key %}
            <div class="error">{{ key }}</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <div class="input-group">
                <label>Security ID</label>
                <input type="text" name="security_id" placeholder="Enter your ID" required>
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" name="pass" placeholder="Enter password" required>
            </div>

            <button class="login-btn" type="submit">Login</button>
        </form>

        <div class="extra">
            Don’t have an account?
            <a href="Security_sign">Create one</a>
        </div>
    </div>

</body>
</html>
